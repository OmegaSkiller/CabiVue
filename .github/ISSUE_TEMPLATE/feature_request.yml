name: Feature request
description: Describe a household inventory problem and a useful outcome.
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior and boundaries
      description: Keep medicine selection, dosing, diagnosis, and real health records out of the request.
    validations:
      required: true
