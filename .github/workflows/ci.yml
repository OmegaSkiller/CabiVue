name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cabivue:ci .
      - run: |
          docker run -d --name cabivue-ci cabivue:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' cabivue-ci)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs cabivue-ci
          exit 1
